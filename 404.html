<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — DevisApps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050507'/%3E%3Cpath d='M14 12h18c14 0 22 8 22 20S46 52 32 52H14z' fill='%23E8291A'/%3E%3C/svg%3E">
<meta name="theme-color" content="#07070A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Idée de mise en page : la page se lit comme un cahier de contrôle, avec des points numérotés, des états « conforme » et des captures réelles dans des fenêtres. Thème sombre unique, voulu : c'est l'identité DevisApps. */
:root {
  --ink: #07070A;
  --panel: #101015;
  --raise: #17171E;
  --line: rgba(240,237,232,.12);
  --paper: #F0EDE8;
  --mute: #A9A59E;
  --signal: #E8291A;
  --ok: #46B97F;
  --display: 'Rajdhani', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;
  color-scheme: dark;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--signal); color: #fff; padding: 10px 16px; z-index: 100; }
.skip:focus { left: 8px; }

/* header */
header.top { position: sticky; top: 0; z-index: 50; background: rgba(7,7,10,.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
.logo { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .06em; text-decoration: none; }
.logo span { color: var(--signal); }
nav.main { display: flex; align-items: center; gap: 28px; }
nav.main a { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); text-decoration: none; }
nav.main a:hover { color: var(--paper); }
.btn { display: inline-block; background: var(--signal); border: 1px solid var(--signal); color: #fff; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; padding: 13px 26px; transition: background .2s, color .2s; cursor: pointer; }
.btn:hover { background: transparent; color: var(--signal); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--paper); }
.btn.ghost:hover { border-color: var(--signal); color: var(--signal); }
.btn.small { padding: 9px 18px; font-size: 14px; }
@media (max-width: 860px) { nav.main a:not(.btn) { display: none; } }

/* hero */
.hero { position: relative; padding: 72px 0 80px; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(232,41,26,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(232,41,26,.07) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 70% 90% at 70% 40%, #000 20%, transparent 75%); pointer-events: none; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; align-items: center; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-bottom: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(52px, 7.4vw, 100px); line-height: .94; letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--signal); }
.hero p.sub { margin-top: 26px; max-width: 470px; font-size: 18px; font-weight: 300; color: var(--mute); }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.norms { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 40px; }
.norms span { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; border: 1px solid var(--line); color: var(--mute); padding: 6px 10px; }
.hero-art { position: relative; padding-bottom: 54px; }
.hero-art .frame.main { position: relative; box-shadow: 0 0 80px rgba(232,41,26,.22), 0 30px 60px rgba(0,0,0,.5); }
.hero-art .frame.main .screen::after { content: ''; position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--signal), transparent); top: 0; animation: sweep 2.4s ease-out 1 .4s both; opacity: 0; }
@keyframes sweep { 0% { top: 0; opacity: .9; } 100% { top: 100%; opacity: 0; } }
.hero-art .frame.second { position: absolute; width: 56%; left: -9%; bottom: 0; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.verdict { position: absolute; right: 0; top: -46px; background: var(--panel); border: 1px solid var(--ok); color: var(--ok); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; padding: 9px 13px; z-index: 3; }
.verdict b { color: var(--paper); font-weight: 700; }
@media (max-width: 960px) { .hero .wrap { grid-template-columns: 1fr; gap: 40px; } .hero-art .frame.second { display: none; } .hero-art { padding-bottom: 0; } .verdict { right: 8px; } }

/* fenêtre */
.frame { background: #0b0b0f; border: 1px solid var(--line); }
.frame .bar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; background: var(--raise); border-bottom: 1px solid var(--line); }
.frame .bar i { width: 8px; height: 8px; border-radius: 50%; background: rgba(240,237,232,.22); }
.frame .bar i:first-child { background: var(--signal); }
.frame .bar span { margin-left: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frame .screen { position: relative; overflow: hidden; }
.frame .screen img, .frame .screen svg { width: 100%; height: auto; display: block; }

/* bandeau */
.band { border-block: 1px solid var(--line); background: var(--panel); }
.band .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.band .cell { padding: 28px 24px; border-left: 1px solid var(--line); }
.band .cell:first-child { border-left: 0; padding-left: 0; }
.band b { display: block; font-family: var(--display); font-size: 44px; line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums; }
.band b em { font-style: normal; color: var(--signal); }
.band span { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
@media (max-width: 760px) { .band .wrap { grid-template-columns: 1fr 1fr; } .band .cell { border-left: 0; padding: 22px 0; border-top: 1px solid var(--line); } .band .cell:nth-child(-n+2) { border-top: 0; } .band .cell:nth-child(even) { padding-left: 20px; border-left: 1px solid var(--line); } }

/* sections */
section.s { padding: 96px 0 24px; }
.point { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); }
.point::after { content: ''; flex: 0 1 120px; height: 1px; background: var(--signal); opacity: .5; }
h2 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 5vw, 58px); line-height: 1; text-wrap: balance; max-width: 760px; }
h2 em { font-style: normal; color: var(--signal); }
.lead { margin-top: 18px; max-width: 600px; color: var(--mute); font-weight: 300; font-size: 17px; }

/* vitrine par onglets */
.tabs { display: flex; gap: 4px; margin-top: 44px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--mute); font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: .03em; cursor: pointer; white-space: nowrap; transition: color .2s; }
.tabs button:hover { color: var(--paper); }
.tabs button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--signal); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); }
.dot.wip { border: 1.5px solid var(--mute); }
.panel { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 48px; padding: 44px 0 8px; align-items: start; }
.panel[hidden] { display: none; }
.chip { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line); color: var(--mute); padding: 4px 10px; }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.p-text h3 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; margin-top: 16px; }
.p-text .plat { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); margin-top: 8px; }
.p-text > p:not(.chip):not(.plat) { margin-top: 16px; color: var(--mute); font-weight: 300; }
.p-text ul { list-style: none; margin: 22px 0 28px; display: grid; gap: 12px; }
.p-text li { position: relative; padding-left: 28px; font-size: 15px; }
.p-text li::before { content: ''; position: absolute; left: 0; top: 6px; width: 12px; height: 7px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg) scale(.9); }
.p-shot { margin: 0; }
.p-shot .frame { box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.p-shot .screen img { transition: opacity .25s; }
.cap { margin-top: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.thumbs { display: flex; gap: 10px; margin-top: 14px; }
.thumbs button { width: 112px; padding: 0; border: 1px solid var(--line); background: var(--panel); cursor: pointer; opacity: .6; transition: opacity .2s, border-color .2s; }
.thumbs button:hover { opacity: 1; }
.thumbs button[aria-current="true"] { opacity: 1; border-color: var(--signal); }
@media (max-width: 900px) { .panel { grid-template-columns: 1fr; gap: 32px; } }

/* terrain */
.rows { margin-top: 44px; display: grid; gap: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 5fr) 40px minmax(0, 4fr); gap: 24px; align-items: baseline; padding: 26px 0; border-bottom: 1px solid var(--line); }
.row .need { color: var(--mute); font-weight: 300; font-size: 17px; }
.row .arr { font-family: var(--mono); color: var(--signal); }
.row .app { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; }
.row .app small { display: block; margin-top: 6px; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
@media (max-width: 760px) { .row { grid-template-columns: 1fr; gap: 8px; } .row .arr { display: none; } }
.quote { margin-top: 56px; border-left: 3px solid var(--signal); padding-left: 28px; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.15; max-width: 820px; text-wrap: balance; }
.quote em { font-style: normal; color: var(--signal); }

/* méthode */
.steps { margin-top: 44px; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.step { padding: 26px 24px 8px 0; position: relative; }
.step + .step { padding-left: 24px; border-left: 1px solid var(--line); }
.step b { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--signal); }
.step h3 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 10px 0 6px; }
.step p { color: var(--mute); font-weight: 300; font-size: 15px; }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } .step:nth-child(3) { padding-left: 0; border-left: 0; } .step:nth-child(n+3) { border-top: 1px solid var(--line); margin-top: 24px; } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } .step, .step + .step { padding-left: 0; border-left: 0; } .step + .step { border-top: 1px solid var(--line); margin-top: 20px; } }

/* faq */
details { border-bottom: 1px solid var(--line); }
details:first-of-type { border-top: 1px solid var(--line); }
summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 20px 0; font-family: var(--display); font-weight: 600; font-size: 22px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; font-family: var(--mono); color: var(--signal); }
details[open] summary::after { content: '–'; }
details p { padding: 0 0 22px; max-width: 680px; color: var(--mute); font-weight: 300; }
.faq-wrap { margin-top: 36px; }

/* contact */
.contact { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; align-items: start; }
.contact .mail { display: inline-block; margin-top: 26px; font-family: var(--mono); color: var(--signal); font-size: 16px; text-decoration: none; }
.contact .small-note { margin-top: 14px; color: var(--mute); font-size: 14px; }
form { background: var(--panel); border: 1px solid var(--line); padding: 30px; display: grid; gap: 16px; }
form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
label { display: grid; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
input, select, textarea { font: inherit; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--paper); background: var(--ink); border: 1px solid var(--line); padding: 12px 13px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px rgba(232,41,26,.18); }
textarea { min-height: 120px; resize: vertical; }
form .btn { justify-self: start; }
.hp { position: absolute; left: -9999px; }
.demo-note { font-size: 13px; color: var(--ok); min-height: 20px; }
@media (max-width: 900px) { .contact { grid-template-columns: 1fr; gap: 32px; } form .two { grid-template-columns: 1fr; } }
section.s:last-of-type { padding-bottom: 96px; }

footer { border-top: 1px solid var(--line); padding: 36px 0; color: var(--mute); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
footer nav { display: flex; gap: 20px; }
footer a { text-decoration: none; }
footer a:hover { color: var(--signal); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero-art .frame.main .screen::after { animation: none; display: none; } * { transition: none !important; } }

.hero.sub .wrap { grid-template-columns: minmax(0,6fr) minmax(0,5fr); }
.hero.sub h1 { font-size: clamp(44px, 6vw, 84px); }
.stats { display: flex; flex-wrap: wrap; gap: 28px 40px; margin-top: 40px; }
.stats b { display: block; font-family: var(--display); font-size: 40px; line-height: 1; }
.stats b em { font-style: normal; color: var(--signal); }
.stats span { display: block; margin-top: 6px; max-width: 170px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.art { margin: 0; }
.art svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 40px rgba(232,41,26,.18)); }
.art figcaption { margin-top: 10px; text-align: right; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.cards { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.card { padding: 28px 26px 30px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.card span { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--signal); }
.card h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 10px 0 8px; }
.card p { color: var(--mute); font-weight: 300; font-size: 15px; }
@media (max-width: 960px) { .hero.sub .wrap { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }

.page { padding: 72px 0 96px; max-width: 760px; }
.page h1 { font-family: var(--display); font-size: clamp(40px,6vw,64px); line-height: 1; margin-bottom: 32px; }
.page h2 { font-family: var(--display); font-size: 26px; margin: 32px 0 8px; }
.page p { color: var(--mute); font-weight: 300; margin-bottom: 10px; }
.page a { color: var(--signal); }
</style>

</head>

<header class="top"><div class="wrap"><a class="logo" href="index.html">Devis<span>Apps</span></a><nav class="main"><a href="index.html">Accueil</a><a href="metier.html">Le métier</a></nav></div></header>
<main class="wrap page">

</main>
<footer><div class="wrap"><span>© 2026 DevisApps · France</span><nav aria-label="Pied de page"><a href="index.html">Accueil</a><a href="mentions-legales.html">Mentions légales</a><a href="confidentialite.html">Confidentialité</a></nav></div></footer>
</body></html>
